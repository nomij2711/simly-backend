<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Successful - SimlyX</title>
  <link rel="icon" type="image/png" href="/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --success: #10b981;
      --success-dark: #059669;
      --bg: #0b0f19;
      --card-bg: rgba(17, 24, 39, 0.85);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: rgba(255, 255, 255, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(at 0% 0%, rgba(79, 70, 229, 0.2) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.15) 0px, transparent 50%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 24px;
      padding: 40px 32px;
      max-width: 460px;
      width: 100%;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 40px rgba(16, 185, 129, 0.15);
      animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px) scale(0.96);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .icon-wrapper {
      width: 84px;
      height: 84px;
      background: rgba(16, 185, 129, 0.15);
      border: 2px solid rgba(16, 185, 129, 0.3);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      position: relative;
    }

    .icon-wrapper::after {
      content: '';
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 2px solid var(--success);
      animation: pulse 2s infinite;
      opacity: 0;
    }

    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.8; }
      100% { transform: scale(1.4); opacity: 0; }
    }

    .icon-wrapper svg {
      width: 44px;
      height: 44px;
      color: var(--success);
      stroke-dasharray: 100;
      stroke-dashoffset: 100;
      animation: checkmark 0.8s ease-in-out forwards 0.2s;
    }

    @keyframes checkmark {
      to {
        stroke-dashoffset: 0;
      }
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #34d399;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 6px 14px;
      border-radius: 20px;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 26px;
      font-weight: 800;
      margin-bottom: 10px;
      background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    .details-box {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 24px;
      text-align: left;
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      font-size: 13px;
    }

    .detail-row:not(:last-child) {
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .detail-label {
      color: var(--text-muted);
    }

    .detail-value {
      color: var(--text);
      font-weight: 600;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-hover) 100%);
      color: white;
      text-decoration: none;
      font-weight: 700;
      font-size: 15px;
      padding: 14px 24px;
      border-radius: 14px;
      border: none;
      cursor: pointer;
      box-shadow: 0 10px 20px -5px rgba(79, 70, 229, 0.4);
      transition: all 0.2s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 25px -5px rgba(79, 70, 229, 0.5);
    }

    .btn:active {
      transform: translateY(0);
    }

    .footer-note {
      margin-top: 18px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .app-brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 20px;
    }

    .app-brand img {
      width: 32px;
      height: 32px;
      border-radius: 8px;
    }

    .app-brand span {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="app-brand">
      <img src="/logo.png" alt="SimlyX" onerror="this.style.display='none'">
      <span>SimlyX</span>
    </div>

    <div class="icon-wrapper">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
      </svg>
    </div>

    <div class="badge">
      <span>●</span> Payment Confirmed
    </div>

    <h1>Top-Up Successful!</h1>
    <p class="subtitle">
      Your payment was processed securely. Your SimlyX wallet balance has been updated instantly.
    </p>

    <div class="details-box">
      <div class="detail-row">
        <span class="detail-label">Status</span>
        <span class="detail-value" style="color: #34d399;">Success</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Delivery</span>
        <span class="detail-value">Instant Wallet Credit</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Protection</span>
        <span class="detail-value">256-Bit SSL Encrypted</span>
      </div>
    </div>

    <button class="btn" onclick="returnToApp()">
      <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
      </svg>
      Return to SimlyX App
    </button>

    <div class="footer-note">
      You can safely close this browser window and switch back to SimlyX.
    </div>
  </div>

  <script>
    function returnToApp() {
      // Try closing the tab or redirecting to app deep link
      try {
        window.close();
      } catch(e) {}
      window.location.href = 'simlyx://wallet';
    }

    // Auto-attempt return after 4 seconds
    setTimeout(() => {
      try {
        window.close();
      } catch(e) {}
    }, 4000);
  </script>
</body>
</html>
